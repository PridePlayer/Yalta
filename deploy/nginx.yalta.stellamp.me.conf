# ============================================================
# 雅尔塔会议 —— 宝塔站点「配置文件」内容（整体替换 server 块即可）
# 站点根目录：Yalta/dist（前端构建产物）
# 后端：Node WebSocket 服务监听 127.0.0.1:8080，由本配置反代 /ws
# ============================================================

server {
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name yalta.stellamp.me;
    index index.html index.htm;
    root /www/wwwroot/yalta.stellamp.me/Yalta/dist;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/yalta.stellamp.me.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/yalta.stellamp.me/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/yalta.stellamp.me/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/yalta.stellamp.me/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/yalta.stellamp.me.conf;
    #REWRITE-END

    # ============ WebSocket 反代到 Node 后端 ============
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # ====================================================

    # ============ 欧洲地图大图：长缓存省带宽 ============
    # 仅对这张 ~2MB 的地图设 immutable（一年内浏览器免重连校验、零带宽）
    # 换图时改前端 url 里的 ?v= 版本号即可让缓存失效
    location = /photos/europe-map-bg.jpg {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    # ====================================================

    # ============ SPA fallback（前端路由刷新不 404）============
    location / {
        try_files $uri $uri/ /index.html;
    }
    # ====================================================

    # 禁止访问敏感文件/目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # 静态图片：30 天缓存
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # 静态 JS/CSS：12 小时缓存
    location ~ .*\.(js|css)?$ {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/yalta.stellamp.me.log;
    error_log  /www/wwwlogs/yalta.stellamp.me.error.log;
}
