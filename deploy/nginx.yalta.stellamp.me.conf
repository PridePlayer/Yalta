# ============================================================
# 雅尔塔会议 — 生产环境 Nginx 配置
# 作用：① 托管前端静态产物(dist/)  ② 把同域 /ws 反代到本地 node 后端
# 放置位置（二选一）：
#   /etc/nginx/sites-available/yalta.stellamp.me
#   然后 ln -s 到 /etc/nginx/sites-enabled/
#   或直接放进 /etc/nginx/conf.d/yalta.stellamp.me.conf
# 证书路径默认按 certbot 写，若不同请改下面两行 ssl_certificate*
# ============================================================

# HTTP → HTTPS 重定向（同时保留证书校验路径）
server {
    listen 80;
    listen [::]:80;
    server_name yalta.stellamp.me;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yalta.stellamp.me;

    # —— 若证书路径不同，请改成你的实际路径 ——
    ssl_certificate     /etc/letsencrypt/live/yalta.stellamp.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalta.stellamp.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端构建产物（npm run build 输出到 dist/）
    root /www/wwwroot/yalta.stellamp.me/Yalta/dist;
    index index.html;

    # 大体积背景图：浏览器长期缓存（max-age 1 年 + immutable），省服务器带宽
    location = /photos/europe-map-bg.jpg {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # 带哈希的前端资源：同样长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # SPA 回退：未知路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket：同域 /ws → 本地 node 后端（后端仅监听 127.0.0.1:8080，不暴露公网）
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
